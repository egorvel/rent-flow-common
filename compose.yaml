services:
  rentflow-keycloak-postgres:
    image: postgres:18.4-alpine
    entrypoint: [bash, /security/entrypoint.sh]
    command: [postgres]
    environment:
      POSTGRES_USER: rentflow_identity_admin
      POSTGRES_DB: postgres
    secrets:
      - keycloak_postgres_admin_password
      - keycloak_db_password
    networks: [identity-db]
    volumes:
      - rentflow-keycloak-postgres-data:/var/lib/postgresql
      - ./security/postgres/entrypoint.sh:/security/entrypoint.sh:ro
      - ./security/postgres/init-keycloak.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready --username rentflow_identity_admin --dbname rentflow_keycloak"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  rentflow-keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    user: "${SECURITY_UID:-1000}:0"
    entrypoint: [bash, /security/entrypoint.sh]
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://rentflow-keycloak-postgres:5432/rentflow_keycloak
      KC_DB_USERNAME: rentflow_keycloak
      KC_HOSTNAME: http://auth.rentflow.test:${KEYCLOAK_HTTP_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HTTP_PORT: "${KEYCLOAK_HTTP_PORT:-8180}"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_LOG_LEVEL: warn
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-rentflow-local}
      KEYCLOAK_PKCE_PORT: "${KEYCLOAK_PKCE_PORT:-8765}"
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-8180}:${KEYCLOAK_HTTP_PORT:-8180}"
    secrets: [keycloak_db_password]
    volumes:
      - ./security/keycloak/entrypoint.sh:/security/entrypoint.sh:ro
      - ${SECURITY_STATE_DIR:-./.secrets/security}/runtime/import:/opt/keycloak/data/import:ro
    networks:
      default:
        aliases: [auth.rentflow.test]
      identity-db:
    depends_on:
      rentflow-keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '; } 3<>/dev/tcp/127.0.0.1/9000"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 120s

  # temporary container that runs security integration checks
  security-check:
    image: rentflow-security-check:phase1
    profiles: [security-tools]
    build:
      context: .
      dockerfile: security/check/Dockerfile
    user: "${SECURITY_UID:-1000}"
    volumes:
      - ${SECURITY_STATE_DIR:-./.secrets/security}:/state:ro
    read_only: true
    tmpfs: [/tmp]

  rentflow-postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentflow}
      POSTGRES_USER: ${POSTGRES_USER:-rentflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentflow-admin-local}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:-inventory}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory-local}
      PRICING_DB_USER: ${PRICING_DB_USER:-pricing}
      PRICING_DB_PASSWORD: ${PRICING_DB_PASSWORD:-pricing-local}
      RESERVATION_DB_USER: ${RESERVATION_DB_USER:-reservation}
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD:-reservation-local}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:-monitoring-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rentflow-postgres-data:/var/lib/postgresql
      - ../rent-flow-inventory/docker/postgres/init-inventory.sh:/docker-entrypoint-initdb.d/10-init-inventory.sh:ro
      - ../rent-flow-pricing/docker/postgres/init-pricing.sh:/docker-entrypoint-initdb.d/20-init-pricing.sh:ro
      - ../rent-flow-reservation/docker/postgres/init-reservation.sh:/docker-entrypoint-initdb.d/30-init-reservation.sh:ro
      - ./observability/postgres/init-monitoring.sh:/docker-entrypoint-initdb.d/40-init-monitoring.sh:ro
    healthcheck:
      test: pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  rentflow-redis:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: redis-cli ping
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  rentflow-kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@rentflow-kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://rentflow-kafka:19092,HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-false}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:-0}"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - rentflow-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  inventory:
    build:
      context: ../rent-flow-inventory
      dockerfile: Dockerfile
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth.rentflow.test:${KEYCLOAK_HTTP_PORT:-8180}/realms/${KEYCLOAK_REALM:-rentflow-local}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth.rentflow.test:${KEYCLOAK_HTTP_PORT:-8180}/realms/${KEYCLOAK_REALM:-rentflow-local}/protocol/openid-connect/certs
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      OBSERVABILITY_ENVIRONMENT: ${OBSERVABILITY_ENVIRONMENT:-local}
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      TRACING_OTLP_ENDPOINT: http://rentflow-alloy:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      SPRING_DATASOURCE_URL: jdbc:postgresql://rentflow-postgres:5432/${POSTGRES_DB:-rentflow}
      SPRING_DATASOURCE_USERNAME: ${INVENTORY_DB_USER:-inventory}
      SPRING_DATASOURCE_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory-local}
      KAFKA_BOOTSTRAP_SERVERS: rentflow-kafka:19092
      SPRING_PROFILES_ACTIVE: local
    labels:
      rentflow.observability.collect: "true"
      rentflow.observability.service: rent-flow-inventory
      rentflow.observability.environment: ${OBSERVABILITY_ENVIRONMENT:-local}
    depends_on:
      rentflow-kafka:
        condition: service_healthy
      rentflow-postgres:
        condition: service_healthy
    ports:
      - "${INVENTORY_PORT:-8080}:8080"

  pricing:
    build:
      context: ../rent-flow-pricing
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth.rentflow.test:${KEYCLOAK_HTTP_PORT:-8180}/realms/${KEYCLOAK_REALM:-rentflow-local}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth.rentflow.test:${KEYCLOAK_HTTP_PORT:-8180}/realms/${KEYCLOAK_REALM:-rentflow-local}/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: http://auth.rentflow.test:${KEYCLOAK_HTTP_PORT:-8180}/realms/${KEYCLOAK_REALM:-rentflow-local}/protocol/openid-connect/token
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      OBSERVABILITY_ENVIRONMENT: ${OBSERVABILITY_ENVIRONMENT:-local}
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      TRACING_OTLP_ENDPOINT: http://rentflow-alloy:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      SPRING_DATASOURCE_URL: jdbc:postgresql://rentflow-postgres:5432/${POSTGRES_DB:-rentflow}
      SPRING_DATASOURCE_USERNAME: ${PRICING_DB_USER:-pricing}
      SPRING_DATASOURCE_PASSWORD: ${PRICING_DB_PASSWORD:-pricing-local}
      INVENTORY_BASE_URL: http://inventory:8080
      REDIS_HOST: rentflow-redis
      REDIS_PORT: 6379
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-500ms}
      REDIS_COMMAND_TIMEOUT: ${REDIS_COMMAND_TIMEOUT:-200ms}
      PRICING_CACHE_TTL: ${PRICING_CACHE_TTL:-1h}
    secrets:
      - source: pricing_client_secret
        target: spring.security.oauth2.client.registration.inventory.client-secret
    depends_on:
      inventory:
        condition: service_healthy
      rentflow-postgres:
        condition: service_healthy
    ports:
      - "${PRICING_PORT:-8081}:8080"
    labels:
      rentflow.observability.collect: "true"
      rentflow.observability.service: rent-flow-pricing
      rentflow.observability.environment: ${OBSERVABILITY_ENVIRONMENT:-local}

  reservation:
    build:
      context: ../rent-flow-reservation
      dockerfile: Dockerfile
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth.rentflow.test:${KEYCLOAK_HTTP_PORT:-8180}/realms/${KEYCLOAK_REALM:-rentflow-local}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth.rentflow.test:${KEYCLOAK_HTTP_PORT:-8180}/realms/${KEYCLOAK_REALM:-rentflow-local}/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: http://auth.rentflow.test:${KEYCLOAK_HTTP_PORT:-8180}/realms/${KEYCLOAK_REALM:-rentflow-local}/protocol/openid-connect/token
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      OBSERVABILITY_ENVIRONMENT: ${OBSERVABILITY_ENVIRONMENT:-local}
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      TRACING_OTLP_ENDPOINT: http://rentflow-alloy:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      SPRING_DATASOURCE_URL: jdbc:postgresql://rentflow-postgres:5432/rentflow
      SPRING_DATASOURCE_USERNAME: ${RESERVATION_DB_USER:-reservation}
      SPRING_DATASOURCE_PASSWORD: ${RESERVATION_DB_PASSWORD:-reservation-local}
      INVENTORY_BASE_URL: http://inventory:8080
      KAFKA_BOOTSTRAP_SERVERS: rentflow-kafka:19092
      SPRING_PROFILES_ACTIVE: local
      RESERVATION_CANCELLATION_EXPIRATION_HOLD_DURATION: ${RESERVATION_CANCELLATION_EXPIRATION_HOLD_DURATION:-10m}
      RESERVATION_CANCELLATION_RELAY_ENABLED: ${RESERVATION_CANCELLATION_RELAY_ENABLED:-true}
    secrets:
      - source: reservation_client_secret
        target: spring.security.oauth2.client.registration.inventory.client-secret
    depends_on:
      inventory:
        condition: service_healthy
      rentflow-kafka:
        condition: service_healthy
      rentflow-postgres:
        condition: service_healthy
    ports:
      - "${RESERVATION_PORT:-8082}:8080"
    labels:
      rentflow.observability.collect: "true"
      rentflow.observability.service: rent-flow-reservation
      rentflow.observability.environment: ${OBSERVABILITY_ENVIRONMENT:-local}

  rentflow-prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      - --enable-feature=exemplar-storage
    volumes:
      - ./observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - rentflow-prometheus-data:/prometheus

  rentflow-loki:
    image: grafana/loki:3.7.8
    profiles: [observability]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - rentflow-loki-data:/loki

  rentflow-tempo:
    # Keep the monolithic Tempo 2 topology; Tempo 3 requires a different deployment.
    image: grafana/tempo:2.10.8
    profiles: [observability]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - rentflow-tempo-data:/var/tempo

  rentflow-alloy:
    image: grafana/alloy:v1.20.1
    profiles: [observability]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-rent-flow-common}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - rentflow-alloy-data:/var/lib/alloy/data

  rentflow-grafana:
    image: grafana/grafana:13.2.3
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-rentflow-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - rentflow-grafana-data:/var/lib/grafana

  rentflow-postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [observability]
    environment:
      DATA_SOURCE_URI: rentflow-postgres:5432/${POSTGRES_DB:-rentflow}?sslmode=disable
      DATA_SOURCE_USER: rentflow_monitor
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:-monitoring-local}

  rentflow-redis-exporter:
    image: oliver006/redis_exporter:v1.93.0
    profiles: [observability]
    command: ["--redis.addr=redis://rentflow-redis:6379"]

  rentflow-kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    profiles: [observability]
    command:
      - --kafka.server=rentflow-kafka:19092
      - --kafka.version=4.3.1
      - --topic.filter=rentflow\..*
      - --group.filter=rentflow\..*
    restart: on-failure

volumes:
  rentflow-keycloak-postgres-data:
  rentflow-postgres-data:
  rentflow-kafka-data:
  rentflow-prometheus-data:
  rentflow-loki-data:
  rentflow-tempo-data:
  rentflow-alloy-data:
  rentflow-grafana-data:

networks:
  identity-db:
    internal: true

secrets:
  pricing_client_secret:
    file: ${SECURITY_STATE_DIR:-./.secrets/security}/runtime/pricing-recipient-secret
  reservation_client_secret:
    file: ${SECURITY_STATE_DIR:-./.secrets/security}/runtime/reservation-recipient-secret
  keycloak_postgres_admin_password:
    file: ${SECURITY_STATE_DIR:-./.secrets/security}/postgres-admin-password
  keycloak_db_password:
    file: ${SECURITY_STATE_DIR:-./.secrets/security}/keycloak-db-password
